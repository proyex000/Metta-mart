server {
    listen 80;
    server_name mettamart.example.id www.mettamart.example.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mettamart.example.id www.mettamart.example.id;

    # Configure ssl_certificate and ssl_certificate_key with your TLS provider.
    client_max_body_size 6m;

    root /var/www/mettamart/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /media/ {
        alias /var/www/mettamart/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
