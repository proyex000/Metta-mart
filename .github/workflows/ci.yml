name: Metta-Mart CI

on:
  push:
    branches: ["main", "feat/phase1-categories-settings-ui"]
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install MySQL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config default-libmysqlclient-dev
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt
      - name: Django checks
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
          DJANGO_DEBUG: "true"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Backend tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
          DJANGO_DEBUG: "true"
        run: python manage.py test
