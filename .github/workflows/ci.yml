name: Metta-Mart CI

on:
  push:
    branches: ["main", "feat/phase1-categories-settings-ui"]
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.1"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: TypeScript typecheck
        run: pnpm run typecheck
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mettamart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install MySQL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config default-libmysqlclient-dev
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt
      - name: Django checks
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
          DJANGO_DEBUG: "true"
          DB_ENGINE: mysql
          DB_NAME: mettamart
          DB_USER: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_SSL: "false"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Verify production configuration guards
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-production-configuration-check-secret-key-1234567890
          DJANGO_ALLOWED_HOSTS: localhost
          CORS_ALLOWED_ORIGINS: https://mettamart-test.vercel.app
          DJANGO_CSRF_TRUSTED_ORIGINS: https://mettamart-test.vercel.app
          SESSION_COOKIE_SECURE: "true"
          CSRF_COOKIE_SECURE: "true"
          DB_NAME: mettamart
          DB_USER: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_SSL: "true"
        run: |
          if DJANGO_DEBUG=false DB_ENGINE=sqlite python manage.py check; then
            echo "Production configuration incorrectly accepted SQLite."
            exit 1
          fi
          DJANGO_DEBUG=false DB_ENGINE=mysql python manage.py check
      - name: Backend tests (MySQL)
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
          DJANGO_DEBUG: "true"
          DB_ENGINE: mysql
          DB_NAME: mettamart
          DB_USER: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_SSL: "false"
        run: python manage.py test
